[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexamp-avr"
version = "0.1.0"
description = "Turn a Denon AVR on and off from Plexamp playback state"
requires-python = ">=3.10"

[project.scripts]
plexamp-avr = "plexamp_avr.cli:main"

[tool.setuptools.packages.find]
include = ["plexamp_avr*"]

[tool.setuptools.package-data]
plexamp_avr = ["web/*"]
