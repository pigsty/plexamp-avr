version: '3.8'

services:
  plexamp-avr:
    build: .
    container_name: plexamp-avr
    restart: unless-stopped
    network_mode: host
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_VOLUME: ${MAX_VOLUME:-75}
    volumes:
      - /etc/plexamp-avr.conf:/etc/plexamp-avr.conf:ro
      - ./data:/data
