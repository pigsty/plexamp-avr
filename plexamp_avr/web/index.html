<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plexamp AVR">
  <title>Plexamp AVR</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Plexamp AVR</h1>
    <span id="connection" class="status" role="status">Connecting…</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Zones">
    <button type="button" role="tab" id="tab-z1" data-zone="z1" aria-selected="true" aria-controls="zone-panel">Z1</button>
    <button type="button" role="tab" id="tab-z2" data-zone="z2" aria-selected="false" aria-controls="zone-panel">Z2</button>
    <button type="button" role="tab" id="tab-z3" data-zone="z3" aria-selected="false" aria-controls="zone-panel">Z3</button>
    <button type="button" role="tab" id="tab-nav" data-view="nav" aria-selected="false" aria-controls="nav-panel">Nav</button>
    <button type="button" role="tab" id="tab-webhooks" data-view="webhooks" aria-selected="false" aria-controls="webhooks-panel">Webhooks</button>
  </nav>
  <main id="zone-panel" role="tabpanel" aria-labelledby="tab-z1">
    <section class="card row">
      <h2 id="zone-name">Main zone</h2>
      <button type="button" id="power" class="toggle" aria-pressed="false">Off</button>
    </section>
    <section class="card">
      <label for="input">Input</label>
      <select id="input"></select>
      <div id="input-shortcuts" class="input-shortcuts" role="group" aria-label="Input shortcuts" hidden></div>
    </section>
    <section class="card">
      <div class="row">
        <label for="volume">Volume</label>
        <output id="volume-value" for="volume">–</output>
      </div>
      <div class="volume">
        <button type="button" id="volume-down" aria-label="Volume down">−</button>
        <input type="range" id="volume" min="0" max="98" step="0.5" value="0">
        <button type="button" id="volume-up" aria-label="Volume up">+</button>
      </div>
      <button type="button" id="mute" class="toggle wide" aria-pressed="false">Mute</button>
    </section>
    <section class="card">
      <h2>Sound Mode</h2>
      <div id="sound-modes" class="sound-modes" role="group" aria-label="Sound mode">
        <button type="button" class="sound-mode" data-mode="movie" aria-pressed="false">Movie</button>
        <button type="button" class="sound-mode" data-mode="music" aria-pressed="false">Music</button>
        <button type="button" class="sound-mode" data-mode="game" aria-pressed="false">Game</button>
        <button type="button" class="sound-mode" data-mode="pure" aria-pressed="false">Pure</button>
      </div>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <main id="nav-panel" role="tabpanel" aria-labelledby="tab-nav" hidden>
    <section class="card">
      <h2>Navigation</h2>
      <div id="nav-controls" class="nav-controls" role="group" aria-label="AVR remote controls">
        <button type="button" class="nav-action" data-key="info">Info</button>
        <button type="button" class="nav-action" data-key="option">Option</button>
        <button type="button" class="nav-action" data-key="back">Back</button>
        <button type="button" class="nav-action" data-key="setup">Setup</button>
        <div class="dpad" role="group" aria-label="Directional pad">
          <button type="button" data-key="up" class="dpad-up" aria-label="Up">↑</button>
          <button type="button" data-key="left" class="dpad-left" aria-label="Left">←</button>
          <button type="button" data-key="enter" class="dpad-enter">Enter</button>
          <button type="button" data-key="right" class="dpad-right" aria-label="Right">→</button>
          <button type="button" data-key="down" class="dpad-down" aria-label="Down">↓</button>
        </div>
      </div>
    </section>
    <p id="nav-error" class="error" role="alert" hidden></p>
  </main>
  <main id="webhooks-panel" role="tabpanel" aria-labelledby="tab-webhooks" hidden>
    <section class="card row">
      <h2>Webhooks</h2>
      <button type="button" id="webhook-add" class="toggle">Add</button>
    </section>
    <form id="webhook-form" class="card form" hidden>
      <h2 id="webhook-form-title">New webhook</h2>
      <label for="webhook-name">Name</label>
      <input type="text" id="webhook-name" maxlength="100" placeholder="Optional">
      <label class="check"><input type="checkbox" id="webhook-enabled" checked> Enabled</label>
      <div class="grid">
        <div>
          <label for="webhook-zone">Zone</label>
          <select id="webhook-zone">
            <option value="z1">Z1</option>
            <option value="z2">Z2</option>
            <option value="z3">Z3</option>
          </select>
        </div>
        <div>
          <label for="webhook-event">Event</label>
          <select id="webhook-event">
            <option value="power">Power</option>
            <option value="input">Input</option>
            <option value="mute">Mute</option>
          </select>
        </div>
      </div>
      <label for="webhook-value">Value</label>
      <select id="webhook-value"></select>
      <label for="webhook-method">Method</label>
      <select id="webhook-method">
        <option>GET</option>
        <option>PUT</option>
        <option selected>POST</option>
      </select>
      <label for="webhook-url">URL</label>
      <input type="url" id="webhook-url" required maxlength="2048" placeholder="http://example.local/hook">
      <div id="webhook-body-field">
        <label for="webhook-body">Body (optional)</label>
        <textarea id="webhook-body" rows="4" maxlength="16384"></textarea>
      </div>
      <label for="webhook-headers">Headers (JSON)</label>
      <textarea id="webhook-headers" rows="4" spellcheck="false" placeholder='{"Authorization": "Bearer token"}'></textarea>
      <div class="actions">
        <button type="button" id="webhook-cancel">Cancel</button>
        <button type="submit" id="webhook-save" class="primary">Save</button>
      </div>
    </form>
    <ul id="webhook-list" class="webhooks"></ul>
    <p id="webhook-empty" class="muted" hidden>No webhooks configured.</p>
    <p id="webhook-error" class="error" role="alert" hidden></p>
  </main>
  <footer class="playback-footer">
    <section class="card" aria-labelledby="playback-title">
      <div class="row">
        <h2 id="playback-title">Plexamp</h2>
        <span id="playback-state" role="status">Unknown</span>
      </div>
      <p id="idle-timer" class="idle-timer">Idle timer inactive</p>
    </section>
  </footer>
  <script src="app.js"></script>
</body>
</html>
